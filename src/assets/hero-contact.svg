<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="contactHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="mapPinRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="pinGlow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#ef4444" flood-opacity="0.4"/>
    </filter>
    <filter id="glassCard">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="700" height="450" rx="16" fill="url(#contactHeroBg)"/>

  <!-- Radar / Broadcast Rings from Scarborough Office -->
  <circle cx="350" cy="200" r="160" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.25"/>
  <circle cx="350" cy="200" r="230" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.2"/>

  <!-- Ontario Grid Coordinates / Network Map simulation -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="100" y1="50" x2="600" y2="50"/>
    <line x1="100" y1="120" x2="600" y2="120"/>
    <line x1="100" y1="190" x2="600" y2="190"/>
    <line x1="100" y1="260" x2="600" y2="260"/>
    <line x1="100" y1="330" x2="600" y2="330"/>

    <line x1="160" y1="30" x2="160" y2="370"/>
    <line x1="280" y1="30" x2="280" y2="370"/>
    <line x1="400" y1="30" x2="400" y2="370"/>
    <line x1="520" y1="30" x2="520" y2="370"/>
  </g>

  <!-- Center Giant 3D Location Pin on Scarborough Facility -->
  <g transform="translate(350, 160)" filter="url(#pinGlow)">
    <!-- Shadow under Pin -->
    <ellipse cx="0" cy="80" rx="40" ry="15" fill="#000000" opacity="0.6"/>
    <!-- Red Pin -->
    <path d="M 0,-80 C -45,-80 -60,-35 0,70 C 60,-35 45,-80 0,-80 Z" fill="url(#mapPinRed)" stroke="#fecaca" stroke-width="3"/>
    <circle cx="0" cy="-40" r="24" fill="#ffffff"/>
    <text x="0" y="-32" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">🍁</text>
  </g>

  <!-- Floating Information Card 1 (Left): Scarborough HQ -->
  <g transform="translate(80, 100)" filter="url(#glassCard)">
    <rect width="210" height="90" rx="14" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="18" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="35" y="52" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">📍</text>
    <text x="65" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff">SCARBOROUGH HQ</text>
    <text x="65" y="52" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">3001 Markham Rd Unit 20</text>
    <text x="65" y="68" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Scarborough, ON M1X 1L6</text>
  </g>

  <!-- Floating Information Card 2 (Right): 24/7 Rapid Dispatch -->
  <g transform="translate(420, 240)" filter="url(#glassCard)">
    <rect width="210" height="90" rx="14" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="18" fill="#075985" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="52" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">📞</text>
    <text x="65" y="34" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff">DIRECT DISPATCH</text>
    <text x="65" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">1-844-939-9378</text>
    <text x="65" y="68" font-family="Arial, sans-serif" font-size="10" fill="#a7f3d0">● 24/7 Response Active</text>
  </g>

  <!-- Bottom Badge: Instant Quote & Consultation -->
  <g transform="translate(240, 360)">
    <rect width="220" height="34" rx="17" fill="#020617" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="1">
      🍁 ONTARIO-WIDE SUPPORT
    </text>
  </g>
</svg>
