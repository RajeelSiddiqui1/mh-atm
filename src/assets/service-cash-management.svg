<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="cad100" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="cad50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="cad20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="cad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGrad)"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.5"/>
  </pattern>
  <rect width="600" height="380" fill="url(#grid)"/>

  <!-- Banknote 1: $100 Brown -->
  <g transform="translate(140, 40) rotate(-15)" filter="url(#shadow)">
    <rect width="280" height="140" rx="8" fill="url(#cad100)"/>
    <rect x="200" y="0" width="60" height="140" fill="url(#holo)" opacity="0.6"/>
    <text x="18" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fef3c7">100</text>
    <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fde68a">CANADA</text>
    <text x="18" y="90" font-family="Arial, sans-serif" font-size="11" fill="#fef3c7" opacity="0.8">BANK OF CANADA • BANQUE DU CANADA</text>
    <circle cx="140" cy="70" r="32" fill="#78350f" opacity="0.5"/>
    <text x="140" y="76" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#fef3c7" opacity="0.9">🍁</text>
  </g>

  <!-- Banknote 2: $50 Red -->
  <g transform="translate(320, 90) rotate(18)" filter="url(#shadow)">
    <rect width="280" height="140" rx="8" fill="url(#cad50)"/>
    <rect x="200" y="0" width="60" height="140" fill="url(#holo)" opacity="0.6"/>
    <text x="18" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fee2e2">50</text>
    <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fecaca">CANADA</text>
    <text x="18" y="90" font-family="Arial, sans-serif" font-size="11" fill="#fee2e2" opacity="0.8">BANK OF CANADA • BANQUE DU CANADA</text>
    <circle cx="140" cy="70" r="32" fill="#7f1d1d" opacity="0.5"/>
    <text x="140" y="76" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#fee2e2" opacity="0.9">🍁</text>
  </g>

  <!-- Banknote 3: $10 Purple -->
  <g transform="translate(20, 160) rotate(-8)" filter="url(#shadow)">
    <rect width="280" height="140" rx="8" fill="url(#cad10)"/>
    <rect x="200" y="0" width="60" height="140" fill="url(#holo)" opacity="0.6"/>
    <text x="18" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#e0e7ff">10</text>
    <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c7d2fe">CANADA</text>
    <text x="18" y="90" font-family="Arial, sans-serif" font-size="11" fill="#e0e7ff" opacity="0.8">BANK OF CANADA • BANQUE DU CANADA</text>
    <circle cx="140" cy="70" r="32" fill="#3730a3" opacity="0.5"/>
    <text x="140" y="76" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#e0e7ff" opacity="0.9">🍁</text>
  </g>

  <!-- Banknote 4: $5 Blue -->
  <g transform="translate(260, 210) rotate(-12)" filter="url(#shadow)">
    <rect width="270" height="135" rx="8" fill="url(#cad5)"/>
    <rect x="195" y="0" width="55" height="135" fill="url(#holo)" opacity="0.6"/>
    <text x="18" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#e0f2fe">5</text>
    <text x="18" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#bae6fd">CANADA</text>
    <circle cx="135" cy="67" r="30" fill="#0369a1" opacity="0.5"/>
    <text x="135" y="73" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#e0f2fe" opacity="0.9">🍁</text>
  </g>

  <!-- Banknote 5: $20 Green (Hero in Front) -->
  <g transform="translate(130, 150) rotate(4)" filter="url(#shadow)">
    <rect width="320" height="160" rx="10" fill="url(#cad20)"/>
    <!-- Polymer transparent window strip -->
    <rect x="225" y="0" width="70" height="160" fill="url(#holo)" opacity="0.85"/>
    <line x1="225" y1="0" x2="225" y2="160" stroke="#a7f3d0" stroke-width="1.5" opacity="0.6"/>
    <line x1="295" y1="0" x2="295" y2="160" stroke="#a7f3d0" stroke-width="1.5" opacity="0.6"/>

    <!-- Large 20 -->
    <text x="24" y="44" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ecfdf5">20</text>
    <text x="24" y="80" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d1fae5" letter-spacing="1">CANADA</text>
    <text x="24" y="104" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">BANK OF CANADA • BANQUE DU CANADA</text>

    <!-- Maple Leaf Emblem in Window -->
    <circle cx="260" cy="80" r="26" fill="#064e3b" opacity="0.4"/>
    <text x="260" y="88" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#ecfdf5">🍁</text>

    <text x="24" y="140" font-family="Courier, monospace" font-size="10" font-weight="bold" fill="#d1fae5" opacity="0.9">FJZ8472910 • 20 DOLLARS</text>
  </g>

  <!-- Clean Border Overlay -->
  <rect x="0" y="0" width="600" height="380" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>
