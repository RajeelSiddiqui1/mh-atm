<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <linearGradient id="servHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="servGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14b8a6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="700" height="450" rx="16" fill="url(#servHeroBg)"/>

  <!-- Glowing Grid Matrix -->
  <circle cx="350" cy="225" r="180" fill="#0d9488" opacity="0.12"/>
  <circle cx="350" cy="225" r="120" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4"/>
  <circle cx="350" cy="225" r="200" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.3"/>

  <!-- Center Core Hub: 5 Pillars Network Diagram -->
  <!-- Center Hexagon: MH ATM Ecosystem -->
  <g transform="translate(350, 225)" filter="url(#servGlow)">
    <polygon points="0,-45 40,-22 40,22 0,45 -40,22 -40,-22" fill="#0f172a" stroke="#2dd4bf" stroke-width="3"/>
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">MH ATM</text>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#2dd4bf" text-anchor="middle">SERVICES</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">🍁</text>
  </g>

  <!-- Node 1: Cash Vaulting (Top) -->
  <g transform="translate(350, 80)">
    <line x1="0" y1="35" x2="0" y2="100" stroke="#34d399" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="-50" cy="0" r="18" fill="#064e3b" stroke="#34d399"/>
    <text x="-50" y="6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">💵</text>
    <text x="15" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">CASH VAULT</text>
    <text x="15" y="10" font-family="Arial, sans-serif" font-size="9" fill="#34d399">100% Insured Capital</text>
  </g>

  <!-- Node 2: Processing (Top Right) -->
  <g transform="translate(540, 150)">
    <line x1="-35" y1="20" x2="-140" y2="60" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-50" cy="0" r="18" fill="#075985" stroke="#38bdf8"/>
    <text x="-50" y="6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">⚡</text>
    <text x="15" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PROCESSING</text>
    <text x="15" y="10" font-family="Arial, sans-serif" font-size="9" fill="#38bdf8">Interac® &amp; EFT Daily</text>
  </g>

  <!-- Node 3: Maintenance (Bottom Right) -->
  <g transform="translate(510, 330)">
    <line x1="-35" y1="-20" x2="-125" y2="-80" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="-50" cy="0" r="18" fill="#78350f" stroke="#fbbf24"/>
    <text x="-50" y="6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">🔧</text>
    <text x="15" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">MAINTENANCE</text>
    <text x="15" y="10" font-family="Arial, sans-serif" font-size="9" fill="#fbbf24">24/7 Field Techs</text>
  </g>

  <!-- Node 4: Telecom 4G/5G (Bottom Left) -->
  <g transform="translate(190, 330)">
    <line x1="35" y1="-20" x2="125" y2="-80" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <circle cx="-50" cy="0" r="18" fill="#3730a3" stroke="#818cf8"/>
    <text x="-50" y="6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">📡</text>
    <text x="15" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">TELECOM 5G</text>
    <text x="15" y="10" font-family="Arial, sans-serif" font-size="9" fill="#818cf8">No Phone Line Needed</text>
  </g>

  <!-- Node 5: Supplies & Hardware (Top Left) -->
  <g transform="translate(160, 150)">
    <line x1="35" y1="20" x2="140" y2="60" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="-80" y="-35" width="160" height="70" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="-50" cy="0" r="18" fill="#4c1d95" stroke="#a78bfa"/>
    <text x="-50" y="6" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">📦</text>
    <text x="15" y="-6" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">EQUIPMENT</text>
    <text x="15" y="10" font-family="Arial, sans-serif" font-size="9" fill="#a78bfa">OEM Parts &amp; Paper</text>
  </g>
</svg>
