<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="chassisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pcbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="chipMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="toolHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shaftMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="pcbGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#34d399" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Open ATM Interior Chassis -->
  <rect width="600" height="380" fill="url(#chassisBg)"/>

  <!-- Metal Mounting Frame (Silver Bezel) -->
  <polygon points="60,20 540,20 500,360 100,360" fill="#334155" stroke="#64748b" stroke-width="4"/>
  <rect x="110" y="40" width="380" height="290" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Green Main Electronic Circuit Board (PCB) in Center -->
  <g transform="translate(130, 60)" filter="url(#pcbGlow)">
    <rect width="340" height="250" rx="6" fill="url(#pcbGreen)" stroke="#10b981" stroke-width="2"/>

    <!-- PCB Gold Circuit Traces -->
    <g stroke="#fde047" stroke-width="1.5" fill="none" opacity="0.65">
      <path d="M 20,40 L 80,40 L 100,60 L 140,60"/>
      <path d="M 20,70 L 60,70 L 80,90 L 120,90"/>
      <path d="M 20,100 L 50,100 L 70,120 L 110,120"/>
      <path d="M 20,130 L 90,130 L 110,150 L 150,150"/>
      <path d="M 200,40 L 260,40 L 280,60 L 320,60"/>
      <path d="M 210,80 L 250,80 L 270,100 L 320,100"/>
      <path d="M 190,140 L 230,140 L 250,160 L 320,160"/>
      <path d="M 60,180 L 100,180 L 120,200 L 280,200"/>
    </g>

    <!-- Microprocessor Chip 1 (Main CPU) -->
    <rect x="90" y="70" width="65" height="65" rx="3" fill="url(#chipMetal)" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="100" cy="80" r="3" fill="#fbbf24"/>
    <text x="122" y="106" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle" font-weight="bold">ARM-SOC</text>
    <!-- CPU Pins -->
    <g fill="#fde047">
      <circle cx="95" cy="65" r="1.5"/><circle cx="105" cy="65" r="1.5"/><circle cx="115" cy="65" r="1.5"/><circle cx="125" cy="65" r="1.5"/><circle cx="135" cy="65" r="1.5"/><circle cx="145" cy="65" r="1.5"/>
      <circle cx="95" cy="140" r="1.5"/><circle cx="105" cy="140" r="1.5"/><circle cx="115" cy="140" r="1.5"/><circle cx="125" cy="140" r="1.5"/><circle cx="135" cy="140" r="1.5"/><circle cx="145" cy="140" r="1.5"/>
    </g>

    <!-- Microprocessor Chip 2 (Security Crypto Vault Unit) -->
    <rect x="180" y="80" width="80" height="50" rx="3" fill="url(#chipMetal)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="220" y="108" font-family="monospace" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="bold">PCI-PTS VAULT</text>

    <!-- Electrolytic Capacitors & Relays -->
    <circle cx="45" cy="170" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="75" cy="170" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="35" y="200" width="30" height="20" rx="2" fill="#0f172a" stroke="#94a3b8"/>
    <rect x="75" y="200" width="30" height="20" rx="2" fill="#0f172a" stroke="#94a3b8"/>

    <!-- Optical Sensor Bar (Green Illuminated Lenses) on Right -->
    <g transform="translate(295, 30)">
      <rect width="25" height="190" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="12.5" cy="35" r="6" fill="#34d399" opacity="0.9"/>
      <circle cx="12.5" cy="75" r="6" fill="#34d399" opacity="0.9"/>
      <circle cx="12.5" cy="115" r="6" fill="#34d399" opacity="0.9"/>
      <circle cx="12.5" cy="155" r="6" fill="#34d399" opacity="0.9"/>
    </g>

    <!-- Cable Harness Connector at Top -->
    <rect x="135" y="5" width="70" height="15" rx="2" fill="#cbd5e1" stroke="#475569"/>
    <path d="M 170,0 L 170,-30" stroke="#f1f5f9" stroke-width="8"/>
  </g>

  <!-- Technician's Hand & Black Screwdriver Tool (Foreground Action) -->
  <g transform="translate(40, 180) rotate(-28)">
    <!-- Hand / Glove -->
    <ellipse cx="60" cy="100" rx="45" ry="30" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/>
    <!-- Black Screwdriver Handle -->
    <rect x="40" y="40" width="130" height="35" rx="12" fill="url(#toolHandle)" stroke="#475569" stroke-width="2"/>
    <rect x="70" y="40" width="10" height="35" fill="#38bdf8"/> <!-- Rubber Grip Ring -->
    <rect x="100" y="40" width="10" height="35" fill="#38bdf8"/> <!-- Rubber Grip Ring -->
    <!-- Metal Shaft Extending to PCB -->
    <rect x="170" y="52" width="110" height="10" rx="2" fill="url(#shaftMetal)"/>
    <!-- Screwdriver Tip Touching Screw -->
    <polygon points="280,52 295,57 280,62" fill="#64748b"/>
  </g>

  <!-- Badge Overlay -->
  <g transform="translate(170, 335)">
    <rect width="260" height="30" rx="6" fill="#020617" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="1">
      24/7 ONTARIO TECHNICIAN DISPATCH
    </text>
  </g>

  <rect x="0" y="0" width="600" height="380" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>
