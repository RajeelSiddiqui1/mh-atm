<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="towerLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="towerRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="towerGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="suitLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="suitRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="handShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="380" fill="url(#skyGrad)"/>

  <!-- Left Glass Skyscraper (Worm's eye view upward perspective) -->
  <polygon points="40,0 240,0 180,380 0,380" fill="url(#towerLeft)"/>
  <!-- Glass Window Grid on Left Tower -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <line x1="60" y1="0" x2="20" y2="380"/>
    <line x1="110" y1="0" x2="65" y2="380"/>
    <line x1="160" y1="0" x2="110" y2="380"/>
    <line x1="210" y1="0" x2="155" y2="380"/>
    <!-- Horizontals -->
    <line x1="30" y1="40" x2="230" y2="40"/>
    <line x1="25" y1="90" x2="215" y2="90"/>
    <line x1="20" y1="140" x2="200" y2="140"/>
    <line x1="15" y1="190" x2="190" y2="190"/>
    <line x1="10" y1="240" x2="180" y2="240"/>
    <line x1="5" y1="290" x2="170" y2="290"/>
  </g>

  <!-- Right Golden Bronze Skyscraper -->
  <polygon points="360,0 560,0 600,380 420,380" fill="url(#towerRight)"/>
  <g stroke="#fef08a" stroke-width="1.5" opacity="0.4">
    <line x1="390" y1="0" x2="450" y2="380"/>
    <line x1="440" y1="0" x2="500" y2="380"/>
    <line x1="490" y1="0" x2="550" y2="380"/>
    <line x1="540" y1="0" x2="590" y2="380"/>
    <!-- Horizontals -->
    <line x1="370" y1="40" x2="570" y2="40"/>
    <line x1="380" y1="90" x2="575" y2="90"/>
    <line x1="390" y1="140" x2="580" y2="140"/>
    <line x1="400" y1="190" x2="585" y2="190"/>
    <line x1="410" y1="240" x2="590" y2="240"/>
  </g>

  <!-- Center Corporate Handshake Graphic in Foreground -->
  <g filter="url(#handShadow)">
    <!-- Left Hand & Sleeve (Black Suit) -->
    <polygon points="0,200 190,240 180,330 0,380" fill="url(#suitLeft)"/>
    <polygon points="180,240 210,245 200,315 170,310" fill="#ffffff"/> <!-- White Shirt Cuff -->

    <!-- Right Hand & Sleeve (Grey Suit) -->
    <polygon points="600,200 410,240 420,330 600,380" fill="url(#suitRight)"/>
    <polygon points="420,240 390,245 400,315 430,310" fill="#ffffff"/> <!-- White Shirt Cuff -->

    <!-- Left Hand Clasp -->
    <path d="M 210,250 C 240,255 270,270 300,280 C 310,285 330,290 340,280 C 350,270 340,250 310,240 C 270,230 240,240 210,250 Z" fill="url(#skin)"/>
    <!-- Right Hand Clasp & Fingers -->
    <path d="M 390,250 C 360,255 330,270 300,280 C 280,285 260,280 270,265 C 280,250 310,240 350,235 C 370,235 385,245 390,250 Z" fill="url(#skin)"/>

    <!-- Interlocking Hand Details -->
    <ellipse cx="300" cy="275" rx="35" ry="20" fill="#fb923c" opacity="0.4"/>
    <path d="M 270,265 Q 300,285 330,265" stroke="#ea580c" stroke-width="2.5" fill="none"/>
    <path d="M 280,275 Q 300,295 325,275" stroke="#ea580c" stroke-width="2.5" fill="none"/>
    <path d="M 290,285 Q 305,305 320,285" stroke="#ea580c" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Network Protocol Badges -->
  <g transform="translate(180, 20)">
    <rect width="240" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <text x="120" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      ⚡ TNS HIGH-SPEED SWITCH • INTERAC®
    </text>
  </g>

  <rect x="0" y="0" width="600" height="380" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>
