<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="eqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="metalDispenser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="paperRoll" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="cassetteBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="partShadow">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Clean Light Studio Background -->
  <rect width="600" height="380" fill="url(#eqBg)"/>

  <!-- Main Dispenser Mechanism (Top Center) -->
  <g transform="translate(180, 40)" filter="url(#partShadow)">
    <rect width="240" height="150" rx="6" fill="url(#metalDispenser)"/>
    <!-- Internal Rollers & Belts -->
    <rect x="20" y="20" width="200" height="45" rx="4" fill="#0284c7" opacity="0.8"/>
    <circle cx="50" cy="42" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="120" cy="42" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="190" cy="42" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>

    <!-- Gear Teeth -->
    <circle cx="120" cy="105" r="28" fill="#475569" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 4"/>
    <circle cx="120" cy="105" r="12" fill="#0f172a"/>

    <circle cx="65" cy="115" r="20" fill="#334155" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 3"/>
    <circle cx="175" cy="115" r="20" fill="#334155" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="6 3"/>

    <!-- Metal Frame Screws -->
    <circle cx="10" cy="10" r="3" fill="#cbd5e1"/>
    <circle cx="230" cy="10" r="3" fill="#cbd5e1"/>
    <circle cx="10" cy="140" r="3" fill="#cbd5e1"/>
    <circle cx="230" cy="140" r="3" fill="#cbd5e1"/>
  </g>

  <!-- ATM Vault Cash Cassette (Center-Right in Foreground) -->
  <g transform="translate(320, 160)" filter="url(#partShadow)">
    <polygon points="0,60 160,20 230,70 70,110" fill="#e2e8f0"/> <!-- Top Lid -->
    <polygon points="70,110 230,70 230,150 70,190" fill="url(#cassetteBody)"/> <!-- Front Face -->
    <polygon points="0,60 70,110 70,190 0,140" fill="#94a3b8"/> <!-- Left Side -->

    <!-- Green Security Handle / Latch -->
    <polygon points="120,80 180,65 180,95 120,110" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <rect x="135" y="80" width="30" height="15" rx="3" fill="#065f46"/>

    <!-- Key Lock on Cassette -->
    <circle cx="50" cy="145" r="10" fill="#334155" stroke="#f1f5f9" stroke-width="2"/>
    <rect x="48" y="142" width="4" height="6" fill="#0f172a"/>
  </g>

  <!-- Thermal Paper Rolls (Left Foreground) -->
  <g transform="translate(70, 190)" filter="url(#partShadow)">
    <!-- Large Vertical Paper Roll -->
    <ellipse cx="60" cy="40" rx="45" ry="25" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="15" y="40" width="90" height="90" fill="url(#paperRoll)"/>
    <ellipse cx="60" cy="130" rx="45" ry="25" fill="#cbd5e1"/>
    <ellipse cx="60" cy="40" rx="14" ry="8" fill="#0f172a"/>

    <!-- Small Roll Leaning -->
    <g transform="translate(75, 40) rotate(25)">
      <ellipse cx="40" cy="30" rx="35" ry="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="5" y="30" width="70" height="60" fill="url(#paperRoll)"/>
      <ellipse cx="40" cy="90" rx="35" ry="20" fill="#cbd5e1"/>
      <ellipse cx="40" cy="30" rx="10" ry="6" fill="#0f172a"/>
    </g>
  </g>

  <!-- Card Reader Bezel & Accessories (Bottom Center) -->
  <g transform="translate(240, 240)" filter="url(#partShadow)">
    <!-- EMV Bezel Entry -->
    <path d="M 0,30 L 30,0 L 90,0 L 120,30 L 100,70 L 20,70 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <!-- Card Slot with Green Glowing LED Indicator -->
    <rect x="25" y="25" width="70" height="8" rx="4" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
    <line x1="30" y1="29" x2="90" y2="29" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Badge Overlay -->
  <g transform="translate(180, 330)">
    <rect width="240" height="30" rx="6" fill="#0f172a" opacity="0.9"/>
    <text x="120" y="20" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      GENUINE OEM PARTS &amp; SUPPLIES
    </text>
  </g>

  <rect x="0" y="0" width="600" height="380" fill="none" stroke="#cbd5e1" stroke-width="2"/>
</svg>
